name: docker-publish

# v2.79.2 起：源码在 GitHub Actions 上编译并推送多架构镜像到 ghcr.io
# v2.86-PR16 起：push main 也触发 → 每次合 main 都自动重打 :latest + :sha-xxxxxxx
# 触发：
#   1. push main      → 打 :latest + :sha-<7 位 commit>
#   2. push tag v*    → 打 :<版本> + :v<版本> + :latest（如果 tag 在 main 上）
#   3. workflow_dispatch → 手动触发（可选输入 ref / 自定义 tag）
#
# 镜像仓库：ghcr.io/rewind2026/ikev2-panel-v2
# 凭据：用 GitHub 自带 GITHUB_TOKEN，无需额外 PAT

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "自定义 tag（可选，留空用 commit SHA）"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rewind2026/ikev2-panel-v2

jobs:
  build:
    name: build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # 只构建 linux/amd64。
    #
    # 历史：曾用 matrix 让 amd64 / arm64 各自 push 同一个 tag，两者互相覆盖，
    # arm64 从未真正发布成功而 job 全绿。后来改成单 job 双架构，arm64 确实能
    # 编出可用的 aarch64 镜像（已实测：拉取正常，二进制 ELF 头 b7 00），但
    # runner 上的 manifest 校验反复误判，为一个没有实际部署需求的架构持续
    # 投入不划算 —— 现役部署（192.168.50.63）与用户设备均为 amd64。
    #
    # 将来若真需要 arm：把 platforms 改回 linux/amd64,linux/arm64，
    # 并把 Verify 步骤的 PLATFORMS 列表同步加上 arm64。

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # 触发顺序：tag > main push > workflow_dispatch
          # 同时算出 PANEL_VERSION(v2.86-PR18)给 Docker build --build-arg,
          # 让镜像里 /etc/ikev2-panel-version 不再 fallback 成 "dev"。
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # push tag v2.86-pr15 → :2.86-pr15 + :v2.86-pr15 + :latest
            RAW_TAG="${GITHUB_REF_NAME}"            # e.g. v2.86-pr15
            SHORT="${RAW_TAG#v}"                     # e.g. 2.86-pr15
            TAGS="${REGISTRY}/${IMAGE_NAME}:${SHORT},${REGISTRY}/${IMAGE_NAME}:${RAW_TAG},${REGISTRY}/${IMAGE_NAME}:latest"
            PANEL_VERSION="${SHORT}"                 # Dockerfile ARG PANEL_VERSION
            VERSION_SOURCE="tag:${RAW_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            # push main → :latest + :sha-<7 位>（部署端默认拉 :latest）
            SHA="${GITHUB_SHA::7}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${SHA}"
            # v2.86-PR18:main push 时镜像里也写明 "main-<sha>",docker inspect
            # + 启动 banner 都能看出来"这是从哪个 commit 打的"。
            PANEL_VERSION="main-${SHA}"
            VERSION_SOURCE="main:${SHA}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # 手动触发 + 自定义 tag
            CUSTOM="${{ github.event.inputs.tag }}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${CUSTOM}"
            PANEL_VERSION="${CUSTOM}"
            VERSION_SOURCE="dispatch:${CUSTOM}"
          else
            # fallback（不会走到这里，main push 已覆盖）
            SHA="${GITHUB_SHA::7}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${SHA},${REGISTRY}/${IMAGE_NAME}:sha-${SHA}"
            PANEL_VERSION="${SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "panel_version=${PANEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"
          echo "PANEL_VERSION: ${PANEL_VERSION} (${VERSION_SOURCE:-fallback})"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只出 amd64。历史上曾用「矩阵 + 单平台」让两个架构各自 push 同一个
          # tag，结果互相覆盖；后来改成单 job 双架构，buildx 能正确合并 manifest，
          # 但 arm64 无实际部署需求且校验在 runner 上反复误判，故收敛为单架构。
          platforms: linux/amd64
          # tag 通过 -t 多次指定（buildx 支持逗号分隔）
          tags: ${{ steps.meta.outputs.tags }}
          # v2.86-PR18:把算好的版本号传给 Dockerfile ARG,让 /etc/ikev2-panel-version
          # 不再 fallback 到 "dev"。默认 Dockerfile ARG PANEL_VERSION=dev。
          # docker/build-push-action 接受 list 形式,逐行一个 KEY=value。
          build-args: |
            PANEL_VERSION=${{ steps.meta.outputs.panel_version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          # 单一 cache scope：命中率最高，且不会与历史多架构缓存混淆
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          push: true

      - name: Verify image pushed
        # 确认 push 真的落地，且架构正确。
        #
        # 匹配方式踩过三个坑，最终用 imagetools --format '{{.Image}}' 读
        # Platform —— 它对单架构和多架构都返回 {arch os []}，最稳：
        #   1) `--raw` 的 JSON 里，多架构才有 manifests[].platform；
        #      **单架构 manifest 根本没有 architecture 字段**（架构在 config
        #      blob 里），照抄多架构的匹配方式会在单架构上永远失败。
        #   2) 不要匹配 "linux/amd64" 这种连续子串，JSON 里 platform 是拆开的。
        #   3) runner 上 push 完立刻查可能读到上一次的 manifest（GHCR 索引有
        #      传播延迟），故轮询重试。
        run: |
          set -uo pipefail
          # steps.meta.outputs.tags 已经是完整引用（如 ghcr.io/x/y:latest,...），
          # 直接取第一项当被检镜像；不要再拼 REGISTRY/IMAGE_NAME，会拼出
          # "y:ghcr.io/x/y:latest" 这种不存在的引用，然后白等满整个重试窗口。
          TAGS='${{ steps.meta.outputs.tags }}'
          REF="${TAGS%%,*}"
          echo "检查 $REF"

          ok=0
          # GHCR 索引传播通常几秒内完成，6×5s=30s 足够；不再空转 3 分钟
          for i in $(seq 1 6); do
            # 输出形如：{amd64 linux  [] }   /   {arm64 linux/v8 [] }
            INFO=$(docker buildx imagetools inspect "$REF" --format '{{.Image}}' 2>/dev/null || true)
            echo "  第 $i 次: $INFO"
            case "$INFO" in
              *amd64*) ok=1; break ;;
            esac
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::$REF 不是 linux/amd64 镜像"
            exit 1
          fi
          echo "已确认 linux/amd64 镜像已发布: $REF"

      - name: Image digest summary
        run: |
          echo "### 镜像构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 仓库: \`${REGISTRY}/${IMAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构: \`linux/amd64\`（已校验 manifest）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "拉取示例：" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${REGISTRY}/${IMAGE_NAME}:2.86-pr24" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
