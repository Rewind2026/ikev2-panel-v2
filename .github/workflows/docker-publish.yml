name: docker-publish

# v2.79.2 起：源码在 GitHub Actions 上编译并推送多架构镜像到 ghcr.io
# v2.86-PR16 起：push main 也触发 → 每次合 main 都自动重打 :latest + :sha-xxxxxxx
# 触发：
#   1. push main      → 打 :latest + :sha-<7 位 commit>
#   2. push tag v*    → 打 :<版本> + :v<版本> + :latest（如果 tag 在 main 上）
#   3. workflow_dispatch → 手动触发（可选输入 ref / 自定义 tag）
#
# 镜像仓库：ghcr.io/rewind2026/ikev2-panel-v2
# 凭据：用 GitHub 自带 GITHUB_TOKEN，无需额外 PAT

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "自定义 tag（可选，留空用 commit SHA）"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rewind2026/ikev2-panel-v2

jobs:
  build:
    name: build & push (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # v2.86-pr24 修复：此前用 matrix 让 amd64 / arm64 各自 push **同一个 tag**，
    # 两者互相覆盖 —— 后完成的架构把先完成的 manifest 顶掉，最终 registry 里只剩
    # 一个架构。amd64 恰好总是最后 push，所以历史上所有 tag（含 :latest）实际
    # 都是单架构 amd64，arm64 从未发布成功，但 job 全绿、看不出异常。
    # 现在改成单个 job 一次构建两个平台，buildx 自己合并成 manifest index。

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # 触发顺序：tag > main push > workflow_dispatch
          # 同时算出 PANEL_VERSION(v2.86-PR18)给 Docker build --build-arg,
          # 让镜像里 /etc/ikev2-panel-version 不再 fallback 成 "dev"。
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # push tag v2.86-pr15 → :2.86-pr15 + :v2.86-pr15 + :latest
            RAW_TAG="${GITHUB_REF_NAME}"            # e.g. v2.86-pr15
            SHORT="${RAW_TAG#v}"                     # e.g. 2.86-pr15
            TAGS="${REGISTRY}/${IMAGE_NAME}:${SHORT},${REGISTRY}/${IMAGE_NAME}:${RAW_TAG},${REGISTRY}/${IMAGE_NAME}:latest"
            PANEL_VERSION="${SHORT}"                 # Dockerfile ARG PANEL_VERSION
            VERSION_SOURCE="tag:${RAW_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            # push main → :latest + :sha-<7 位>（部署端默认拉 :latest）
            SHA="${GITHUB_SHA::7}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${SHA}"
            # v2.86-PR18:main push 时镜像里也写明 "main-<sha>",docker inspect
            # + 启动 banner 都能看出来"这是从哪个 commit 打的"。
            PANEL_VERSION="main-${SHA}"
            VERSION_SOURCE="main:${SHA}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # 手动触发 + 自定义 tag
            CUSTOM="${{ github.event.inputs.tag }}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${CUSTOM}"
            PANEL_VERSION="${CUSTOM}"
            VERSION_SOURCE="dispatch:${CUSTOM}"
          else
            # fallback（不会走到这里，main push 已覆盖）
            SHA="${GITHUB_SHA::7}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${SHA},${REGISTRY}/${IMAGE_NAME}:sha-${SHA}"
            PANEL_VERSION="${SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "panel_version=${PANEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"
          echo "PANEL_VERSION: ${PANEL_VERSION} (${VERSION_SOURCE:-fallback})"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 一次构建两个平台。必须写成逗号分隔的**列表**，让 buildx 产出
          # manifest index；写成矩阵 + 单平台会让两个 job 互相覆盖同一个 tag。
          # runner 是 amd64，arm64 走 QEMU 模拟（慢，约 30 分钟）。
          platforms: linux/amd64,linux/arm64
          # tag 通过 -t 多次指定（buildx 支持逗号分隔）
          tags: ${{ steps.meta.outputs.tags }}
          # v2.86-PR18:把算好的版本号传给 Dockerfile ARG,让 /etc/ikev2-panel-version
          # 不再 fallback 到 "dev"。默认 Dockerfile ARG PANEL_VERSION=dev。
          # docker/build-push-action 接受 list 形式,逐行一个 KEY=value。
          build-args: |
            PANEL_VERSION=${{ steps.meta.outputs.panel_version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          # 单一 cache scope：两个架构共享，命中率高且不会互相污染命名空间
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
          provenance: false
          push: true

      - name: Verify multi-arch manifest
        # 防御：矩阵时代的静默覆盖就是缺这一步才漏掉的。
        # push 完立刻确认 manifest 里确实有两个架构，而不是被覆盖成单架构。
        #
        # 两个踩过的坑：
        # 1) `--raw` 输出是 JSON，platform 拆成 "architecture"/"os" 两个字段，
        #    不存在 "linux/amd64" 这种连续子串；且冒号后有空格。字面量匹配
        #    会在**正确的**镜像上误报。
        # 2) GHCR 的 manifest 索引更新有传播延迟。Build 结束瞬间 inspect 拿到的
        #    仍是上一次的 manifest —— 实测 push 完成到校验执行只隔 2 秒，
        #    读到的还是旧的单架构 manifest，于是误报。所以必须轮询重试。
        run: |
          set -uo pipefail
          TAGS='${{ steps.meta.outputs.tags }}'
          REF="${REGISTRY}/${IMAGE_NAME}:${TAGS%%,*}"
          echo "检查 $REF"

          ok=0
          for i in $(seq 1 18); do
            docker buildx imagetools inspect "$REF" --raw > manifest.json 2>/dev/null || true
            if grep -q '"manifests"' manifest.json \
               && grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"amd64"' manifest.json \
               && grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"arm64"' manifest.json; then
              echo "已确认多架构: $(grep -oE '"architecture"[[:space:]]*:[[:space:]]*"[a-z0-9]*"' manifest.json | sort -u | tr '\n' ' ')"
              ok=1
              break
            fi
            echo "第 $i 次: manifest 尚未反映双架构，等 10s 重试"
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::$REF 始终没有同时包含 linux/amd64 与 linux/arm64"
            echo "manifest 实际内容(截断): $(head -c 400 manifest.json)"
            exit 1
          fi

      - name: Image digest summary
        run: |
          echo "### 多架构镜像构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 仓库: \`${REGISTRY}/${IMAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构: \`linux/amd64\` + \`linux/arm64\`（已校验 manifest index）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "拉取示例：" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${REGISTRY}/${IMAGE_NAME}:2.86-pr24" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
