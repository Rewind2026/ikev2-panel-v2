# strongSwan charon filelog 配置：把日志写到 /var/log/charon.log。
#
# 为什么需要这个：charon 默认 --use-syslog，但容器内没 syslogd，日志会进黑洞。
# 不写文件就没法排错，v2-72 排查 iOS 拨号失败时就栽过这个坑。
#
# strongSwan conf 语法注意：不能用裸路径作为 section 名（如 `/var/log/charon.log {` 会报
# syntax error），必须用 `name { path = /var/log/charon.log ... }` 的形式。
# 参考：https://docs.strongswan.org/strongswan/conf/filo.html

charon {
    filelog {
        charon-log {
            path = /var/log/charon.log
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            default = 2
            mgr = 0
            net = 1
            enc = 1
            asn = 1
            job = 1
            knl = 1
        }
    }
}
