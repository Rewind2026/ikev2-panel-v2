# swanctl.conf - IPv6-only 主配置（默认）
# 设计见 docs/design.md §9.1
#
# 跟 Apple/strongSwan 官方 EAP 模板对齐（docs.strongswan.org/interop/appleIkev2Profile.html）。
# 客户端走 EAP-MSCHAPv2（用户名 + 密码），mobileconfig 内置 AuthName/AuthPassword，
# iOS 装了 profile 就记下凭证、不弹密码框。
#
# 关键 EAP 必踩的坑（strongSwan iOS 文档）：
#   1. send_cert = always：iOS 默认不发 CERTREQ，不显式 always 会导致 server 等不到
#   2. eap_identity = %identity：iOS 把 EAP identity 当作用户名回传
#   3. server cert 必须有 SAN 匹配 CN + ExtKeyUsage=serverAuth flag
#
# 注意：local_addrs 会在 entrypoint 启动时被替换为实际 IPv6 地址
# 这里留 placeholder，由 entrypoint 通过 sed 注入

connections {
    ikev2-rw {
        # v2-79：local_addrs 可省略，省略时 strongSwan 默认监听所有接口的 500/4500
        # 配合 §0 自动探测（网卡名 + IPv6 公网地址），用户无需关心自己公网 IP
        %IKEV2_LOCAL_ADDRS_DIRECTIVE%
        local {
            auth = pubkey
            certs = %IKEV2_SERVER_CERT_FILE%
            id = %IKEV2_SERVER_CN%
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }
        children {
            ikev2-rw {
                # v2-79：local_ts 也跟着走——IPv6_ONLY 模式下只用 ::/0（出公网靠 v6）；
                # 双栈模式下 0.0.0.0/0, ::/0 都加（v4 出公网走家用路由，v6 出公网直连）
                local_ts = %IKEV2_LOCAL_TS%
                mode = tunnel
                # v2.86-PR10(算法去弱):
                #   - 优先组:ecp256 / curve25519 / modp3072(强算法,新客户端协商时落盘)
                #   - 兜底 1:modp2048 系列(iOS 14/15/16 + Win7 + 老 Android,弱但能连)
                #   - 兜底 2:modpnone(macOS 官方 iOS 互操作文档推荐,无 PFS)
                #   - 不删 sha1 / md5:RFC 8247 明确反对,但 modp2048 fallback 客户端需要
                #   - kernel-libipsec 模式无内核版本要求(完全在 charon 内实现)
                #
                # 兼容性说明:
                #   - iOS 17+/Android 12+:发 ECP256/curve25519/modp3072,协商结果用强算法
                #   - iOS 14/15/16/Win7:发 MODP2048 + SHA1,落 modp2048 兜底(弱但能连)
                #   - macOS:发 modpnone,走 modpnone 兜底(无 PFS,妥协项)
                #
                # ESP SA 协商失败时的客户端日志特征:
                #   "no proposal chosen" 客户端,服务端查 charon.log 找 IKE_SA_INIT
                #
                # 提案顺序:强算法在前(默认协商选择),modp2048 / modpnone 在后(兜底老客户端)
                esp_proposals = aes256gcm16-sha256-ecp256, aes128gcm16-sha256-ecp256, aes256gcm16-sha256-curve25519, aes128gcm16-sha256-curve25519, aes256gcm16-sha256-modp3072, aes128gcm16-sha256-modp3072, aes256gcm16-sha256-modp2048, aes128gcm16-sha256-modp2048, aes256-sha256-modp2048, aes128-sha256-modp2048, aes256gcm16-sha256-modpnone, aes128gcm16-sha256-modpnone, aes256-sha256-modpnone, aes128-sha256-modpnone
                updown = /usr/local/bin/ikev2-updown
            }
        }
        version = 2
        mobike = yes
        # v2.86-PR10:IKE proposal 同步去弱
        #  - 优先组(强算法,新客户端协商时落盘)
        #  - modp3072 替代 modp2048(modp2048 仍保留兜底)
        #  - curve25519 / ecp256(已有) - 强 DH
        #  - 末尾 modp2048 系列仅作 fallback(RFC 8247 不完全合规,但保 iOS 14/15 / 老 Windows 7 能用)
        #
        # 提案顺序:strongSwan 跟客户端做 best-of,preferred 在前
        # iOS 17+/Android 12+:发 ECP256/curve25519/modp3072,协商结果用强算法
        # iOS 14/15/16/Win7:只发 MODP2048,落 modp2048 fallback(弱但能连)
        # macOS:发 modpnone(无 PFS),走 esp_proposals 里的 modpnone 兜底
        proposals = aes256gcm16-sha256-ecp256, aes128gcm16-sha256-ecp256, aes256gcm16-sha256-curve25519, aes128gcm16-sha256-curve25519, aes256gcm16-sha256-modp3072, aes128gcm16-sha256-modp3072, aes256-sha256-modp3072, aes128-sha256-modp3072, aes256gcm16-sha256-modp2048, aes128gcm16-sha256-modp2048, aes256-sha256-modp2048, aes128-sha256-modp2048
        send_certreq = yes
        # iOS 客户端默认不发 CERTREQ（除非 mobileconfig 配 ServerCertificateIssuerCommonName），
        # 必须显式 always 让 server 把证书主动塞给 iOS，iOS 才能验证 server 身份。
        send_cert = always
        unique = replace
        # v2.86-PR10:IKE rekey 周期(strongSwan 6.0+ 用 rekey_time 不是 ikelifetime;
        # 26h = 24h rekey_time + 10% over_time 默认,留 SA 重叠窗口避免断流)
        rekey_time = 24h
        # v2.86-PR10:显式 DPD 配置(macOS rekey 友好)
        dpd_delay = 30s
        dpd_timeout = 120s
        # v2.86-PR10(RFC 6023):childless IKE SA 在 rekey 时让旧 SA 继续承载流量,
        # 断流时间从 500ms 降到 < 100ms。
        # strongSwan 6.0.1 swanctl 选项值: allow / prefer / force / never
        # (没有 yes)。allow = 响应方接受 childless,主动方照常用 IKE_AUTH 创第一个 CHILD。
        childless = allow
        # v2.86-PR10(RFC 7383):启动 IKEv2 消息分片(EAP-MSCHAPv2 模式下 IKE_AUTH
        # 超过 MTU 时被 IP 分片,在某些企业 NAT 后被丢包导致拨号失败)
        fragmentation = yes
        pools = ikev2-pool
    }
}

# 虚拟 IP 池（v2-79 + v2-80 占位符化）：
#   - IPv4：%IKEV2_VPN_SUBNET%（entrypoint §0.6 自动从候选选不冲突的段，
#           默认 10.10.0.0/24）。家用 LAN 是 192.168.x.x/24 时不会冲突；
#           如果换到 10.10.x.x 的 LAN，§0.6 会自动切到 10.13.0.0/24。
#   - IPv6：%IKEV2_VPN_SUBNET_V6%（entrypoint §0.6b 自动从候选选不冲突的 fd00:x::/64，
#           默认 fd00:1::/64）。极小概率(用户家里 LAN 段正好就是 fd00:1::/64)
#           撞了会路由不到；§0.6b 会自动跳过冲突段。
#           公网 IPv6 走 server 公网 IP，ULA pool 主要是给 iOS 16+ 一个 pool 占位。
# 客户端 dial 时会拿到子网内的虚拟 IP，所有流量走 ESP 隧道。
#
# v2-78：加 dns 配置项，strongSwan 通过 ModeConfig 把 DNS 推送给客户端。
# 不推的后果：iPhone 拨号后用拨号前的 DNS（蜂窝/WiFi 缓存），但 iOS 17+
# 把所有 UDP 53 也按 0.0.0.0/0 强制路由进 ESP 隧道 → server 端没指 DNS 时，
# 客户端 DNS 解析可能走不通 → captive.apple.com 探测超时 → Safari/WX
# 直接报"没连接互联网"（即使 TCP 443 实际能 curl 通）。
# 推公网 DNS（1.1.1.1 + 8.8.8.8 + IPv6 2606:4700:4700::1111）绕过内网 DNS
# 不稳定问题。
pools {
    ikev2-pool {
        addrs = %IKEV2_VPN_SUBNET%, %IKEV2_VPN_SUBNET_V6%
        dns = 1.1.1.1, 8.8.8.8, 2606:4700:4700::1111, 2001:4860:4860::8888
    }
}

# EAP-MSCHAPv2 模式：每个用户的密码在 /etc/swanctl/conf.d/<username>.conf 里
# （Go 进程在创建/重置密码时通过 swanctl.Writer 写入，swanctl --load-all 后生效）。
# 这里不放任何 secret，避免重复。

include /etc/swanctl/conf.d/*.conf
