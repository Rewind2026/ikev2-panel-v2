# docker-compose.yml
# 设计见 docs/design.md §10.2
#
# 关键决策（M8 commit 24，2026-09-16）：
#   网络模式：默认 host 网络（因为我们必须监听公网 IPv6 地址，不能接受 docker 默认
#            bridge 的 fd00::/8 ULA——ULA 在公网不可达）。
#
# v2-80 自动网络模式切换（§18.2）：
#   推荐启动方式：./scripts/up.sh（自动探测 + 启动）
#   - 有公网 IPv6 → host 模式（直绑宿主网卡）
#   - 只有公网 IPv4 → bridge + libipsec（端口映射）
#   - 都没有 → bridge + ipvlan（自动建 ipvlan 网络）
#   - 用户显式 IKEV2_NETWORK_MODE=host|bridge|ipvlan → 完全尊重
#
# 老用户（直接 docker compose up -d）仍然可用——本文件默认 host，
# 跟 v2-79.2 行为 100% 一致（向后兼容）。
# 如果你的宿主机器上没有公网 IPv6 / 想用 docker bridge 网络实现多容器隔离，
# 取消下方 ipvlan-network 注释块，并修改网络配置为自己的公网 IPv6 子网。
#
#   Capabilities（v2.86-PR11 减权）：
#   - 删除 privileged: true（OWASP Docker Top-1 容器逃逸风险）
#   - 删除 SYS_ADMIN（v2-79.2 后 forwarding 自愈已经只需要 NET_ADMIN）
#   - cap_drop ALL + cap_add 仅必需 NET_ADMIN / NET_RAW / NET_BIND_SERVICE / CHOWN / DAC_OVERRIDE
#   - 加 no-new-privileges:true 防 setuid 提权
#
#   设备：/dev/net/tun（kernel-libipsec 的用户态 ESP 注入点）
#
#   ESP 兼容性说明（commit 22）：strongSwan 自编译启用 --enable-kernel-libipsec，
#     ESP 包被封装在 UDP/4500（RFC 3948 NAT-T）里，不再走 IP 协议 50。
#     因此即使在 OpenVZ/LXC/部分 KVM 容器宿主上，IKEv2 SA 协商也能成功。
#     公网 IP 上可以同时跑其他服务（HTTPS/SSH/SMTP 等），互不冲突。
#
#   副作用：
#     - host 网络下 8443 直接暴露在公网——建议用防火墙限制源 IP
#     - bridge 网络下 8443 通过 docker 端口映射暴露（0.0.0.0:8443->8443），同样需要防火墙

services:
  ikev2-panel:
    # v2.85-PR1:tag 从 PANEL_TAG 环境变量读(默认 v2.86),与 build.args 同步,
    # 保证 README / compose / Dockerfile 三处一致。改一处,两处都跟着变。
    image: ikev2-panel:${PANEL_TAG:-v2.86}
    build:
      context: .
      args:
        PANEL_VERSION: ${PANEL_TAG:-v2.86}
    container_name: ikev2-panel
    restart: unless-stopped

    # ===== 默认：host 网络 =====
    network_mode: host

    # ===== 可选：bridge 网络（取消下方注释启用）=====
    # 1) 先在宿主机上为 docker 创建 ipvlan，让容器能拿到公网 IPv6 地址：
    #    docker network create -d ipvlan \
      #      --subnet=2408:832e:8a5:1000::/64 \
      #      --gateway=2408:832e:8a5:1000::1 \
      #      -o ipvlan_mode=l2 \
      #      -o parent=ens18 \
      #      ikev2-ipvlan
    #    （注：ens18 和子网要替换成你自己的网卡和段）
    # 2) 取消下方 networks 块，并把上方 network_mode 注释掉
    # networks:
    #   ikev2-ipvlan:
    #     ipv4_address: 172.20.0.10        # 可选，IPv4 内网地址
    #     ipv6_address: 2408:832e:8a5:1000::10  # 公网 IPv6 地址
    # ports:
    #   - "500:500/udp"
    #   - "4500:4500/udp"
    #   - "8443:8443/tcp"

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN           # iptables MASQUERADE、ip link、sysctl forwarding 自愈
      - NET_RAW             # tc qdisc/class/filter
      - NET_BIND_SERVICE    # 监听 500/4500 privileged 端口
      - CHOWN               # entrypoint.sh 改 /etc/swanctl 权限
      - DAC_OVERRIDE        # entrypoint.sh 读 /proc/sys/net

    devices:
      - /dev/net/tun        # kernel-libipsec 必须的 TUN 设备

    security_opt:
      - no-new-privileges:true   # v2.86-PR11:防 setuid 提权

    # v2.86-PR13.4:docker daemon 层日志轮转(跟 ddnsv6 同款 json-file driver)。
    # 这是双保险:即使 ./logs bind mount 写满了 docker 也会按 max-size 滚动,
    # 不会让容器把宿主磁盘吃满。
    # 注意:这是 docker 自己的 stdout/stderr 日志(容器内 Go 进程走的 stdlib log),
    # strongSwan/charon/audit/renew 这些业务日志在 /var/log/*.log(由 ./logs bind mount 接管)。
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # 关键：VPN 服务器需要 IP forwarding。
    #
    # Docker host network mode 下默认会强制把 IPv6 forwarding 重置为 0
    # （docker 已知的安全策略），理论上需要 sysctls: 让 docker daemon
    # 在创建容器前打开宿主内核的 forwarding。
    #
    # v2-79.2 变更：host 网络 + user namespace 模式下 docker daemon 拒绝
    # 写 sysctl（net.ipv4.ip_forward not allowed in host network namespace）。
    # entrypoint.sh §3 会自愈：容器内 echo 1 > /proc/sys/net/ipv6/conf/all/forwarding
    # （NET_ADMIN cap 已足够，v2.86-PR11 不再需要 privileged: true）。
    # 所以这里不再写 sysctls，让 entrypoint 处理。
    #
    # bridge / ipvlan 模式如果需要 sysctl，把下面 sysctls 块解除注释：
    #   sysctls:
    #     net.ipv6.conf.all.forwarding: 1
    #     net.ipv4.ip_forward: 1

    # v2.86-PR11:删除 privileged: true。NET_ADMIN 已足够做 forwarding 自愈 + tc 限速。
    # 容器逃逸风险从"root on host"降到"普通进程"(仍需 0day 才逃逸)。

    # v2.86-PR12.8:不再开 read_only rootfs。理由:
    #   - acme.sh 运行时写 /opt/acme.sh (account.conf + ca/ + 域名证书目录)
    #   - strongSwan 写 /etc/swanctl (x509/ private/ conf.d)
    #   - cron 写 /etc/cron.d (renew + audit-retention)
    #   - Go 进程写 /var/log /data /etc/strongswan.d
    # 这些都是"业务必需的可写路径",用 read_only + tmpfs + entrypoint 同步
    # account.key 的方式反而引入额外复杂度 (rate-limit、dnsapi 遮蔽、account 落盘等)。
    # 跟 nginx-proxy/acme-companion / mailcow / Proxmox VE 等成熟项目一致:
    # 不开 read_only,而用:
    #   - cap_drop / cap_add 限制 Linux capability
    #   - security_opt no-new-privileges
    #   - 业务写路径用 tmpfs (swanctl/cron 频繁变化,容器重启不需要)
    #   - acme.sh 工作目录用命名 volume (/data),天然持久化
    tmpfs:
      - /tmp:size=64m
      # v2.86-PR13.4:/var/log 已改 bind mount 到宿主机 ./logs,不再需要 tmpfs。
      # 之前 tmpfs 128m 的痛点:重启即丢 + 满了容器内进程写不进去导致 500。
      - /var/run:size=32m
      - /run:size=32m
      # v2.86-PR11.1:strongSwan 必须能写 /etc/swanctl (conf.d + x509 + private),
      # Go 进程也会写证书到 /etc/swanctl/x509/。这些是运行时频繁变化的临时
      # 状态 (LE 续签重新 load cert、per-user conf.d 写入等),不需要跨容器重启
      # 保留——entrypoint.sh §4.5b 启动时从 /etc/swanctl.dist (只读镜像层) 恢复。
      - /etc/swanctl:size=32m
      # v2.86-PR11.1:entrypoint.sh §7.5 / §7.7 写 cron 任务到 /etc/cron.d,
      # LE 模式 renew + 审计 retention 都靠它。同样是运行时频繁变化,不需要持久化。
      - /etc/cron.d:size=1m

    volumes:
      # 挂载命名 volume（必须与旧容器同名，避免升级时丢数据）。
      # 命名方式：project_volume，project 来自 docker-compose.yml 同级目录名（ikev2-panel-v2）。
      # 如果升级时改了项目名（比如改成 ikev2-panel-v2-v2-74），docker 会创建新 volume，
      # 老的 LE 证书和 panel.db 都没了 → 必须用 external 显式指定旧 volume 名。
      # 这里用 external 锁死 v2-72/v2-73 那次创建的旧 volume 名。
      #
      # v2.86-PR12.8:/data 下包含 4 类持久化数据:
      #   - panel.db       SQLite (用户/审计/证书配置)
      #   - panel-state/   运行时配置 (cert.conf + aliyun.creds + subnet.conf)
      #   - le/            Let's Encrypt 签发的证书 (fullchain + privkey)
      #   - acme-sh/       acme.sh working dir (ca/ + account.json + 域名证书目录)
      #   dnsapi/deploy/notify 是 acme.sh 二进制的伴生文件,在镜像 /opt/acme.sh/
      #   (Dockerfile 里 cp -a 进去的),不随容器重启丢失——跟 /data 无关。
      - ikev2-panel-v2_ikev2-data:/data   # 持久化:DB + 证书 + LE 证书 + acme.sh account

      # v2.86-PR13.4:日志 bind 到宿主机 ./logs,重启不丢 + 可直接 tail -f 排查。
      # docker daemon 层另加 logging: json-file 轮转做双保险(见下方 logging 段)。
      # 容器内进程(Go / strongSwan / acme.sh / cron)都需要写 /var/log,
      # Dockerfile 已经 chmod 1777 /var/log,容器内任何用户都能写。
      # 宿主机目录 ./logs 由 scripts/up.sh 在启动前 mkdir -p + chmod 1777 创建。
      - ./logs:/var/log:rw

      # v2-79.2：把宿主 /etc/sysctl.d 挂进容器（ro：默认值查询；rw：自愈时持久化）。
      # 容器内 root 通过这条挂载在 /host-sysctl.d 写入 99-ikev2.conf，
      # 宿主 systemd-sysctl.service 重启时自动加载 → 下次部署/重启永远自带 forwarding=1。
      # 必须是 rw，否则 entrypoint §3 自愈后写不进宿主。
      - /etc/sysctl.d:/host-sysctl.d:rw

    environment:
      # 基础
      IKEV2_DATA_DIR: "/data"
      IKEV2_LISTEN_ADDR: "0.0.0.0:8443"
      IKEV2_LOG_LEVEL: "info"
      IKEV2_LOG_FORMAT: "text"

      # 服务器身份（v2-79：所有字段都可以不传，entrypoint.sh §0 自动探测）
      # 唯一必填的是 IKEV2_SERVER_CN（证书需要）
      IKEV2_SERVER_CN: "${IKEV2_SERVER_CN:-vpn.example.com}"
      # 公网 IPv6（host 网络下留空 → 从网卡自动取）
      # 公网 IPv4（双栈模式留空 → 从网卡自动取）
      # 双栈模式（需要宿主 IPv4 UDP 500/4500 可用）：IKEV2_IPV6_ONLY=false
      IKEV2_IPV6_ONLY: "${IKEV2_IPV6_ONLY:-true}"
      # 出口网卡（host 网络下留空 → ip route 自动探测）
      IKEV2_OUT_IF: "${IKEV2_OUT_IF:-}"
      # VPN 网络模式（v2-79）：auto | host | bridge | ipvlan
      # 默认 auto：宿主有公网 IP → host；只有局域网 IP → bridge
      IKEV2_NETWORK_MODE: "${IKEV2_NETWORK_MODE:-auto}"
      # VPN 内部虚拟 IP 段（v2-79）：auto | 10.10.0.0/24 | ...
      # auto 模式下扫描宿主 LAN 段，自动选不冲突的段
      IKEV2_VPN_SUBNET: "${IKEV2_VPN_SUBNET:-auto}"

      # 证书模式
      IKEV2_CERT_MODE: "${IKEV2_CERT_MODE:-self-signed}"
      IKEV2_DOMAIN: "${IKEV2_DOMAIN:-}"             # LE 模式必填
      # IKEV2_ACME_EMAIL: "you@example.com"

      # LE 模式（仅 letsencrypt 时生效）：阿里云 DNS API 凭证
      # 从 .env 读（不在镜像内、不在 git 中）
      Ali_Key: "${Ali_Key:-}"
      Ali_Secret: "${Ali_Secret:-}"

      # v2-82 DDNS(v2-84 family-aware:支持 v4 / v6 / dual)。
      # 适用场景:VPS 公网 IP 动态分配(家用墙 / 部分云厂商),DDNS 把域名
      # 解析跟着变。证书本身跟 IP 无关(SAN 只放域名),不需要重签。
      #
      # v2-84 新增:
      #   IKEV2_DDNS_FAMILY     - v4 / v6 / dual(默认 dual,即 A+AAAA 都同步)
      #   IKEV2_DDNS_PROBE_TARGET - IPv4 探测目标(默认 8.8.8.8;大陆可改 223.5.5.5)
      #
      # 注意:IPv4 DDNS 必须 host 网络(bridge 网络下 8.8.8.8 不通 / 拿到容器 IP)
      IKEV2_DDNS_ENABLED: "${IKEV2_DDNS_ENABLED:-false}"
      IKEV2_DDNS_FAMILY: "${IKEV2_DDNS_FAMILY:-dual}"
      IKEV2_DDNS_PROBE_TARGET: "${IKEV2_DDNS_PROBE_TARGET:-8.8.8.8}"
      ALIYUN_ACCESS_KEY_ID: "${ALIYUN_ACCESS_KEY_ID:-}"
      ALIYUN_ACCESS_KEY_SECRET: "${ALIYUN_ACCESS_KEY_SECRET:-}"
      ALIYUN_DOMAIN: "${ALIYUN_DOMAIN:-}"
      ALIYUN_RR: "${ALIYUN_RR:-vpn}"

      # 其他
      IKEV2_DEFAULT_USER_PASSWORD_LEN: "12"
      IKEV2_SESSION_TTL: "24h"

      # v2.85-PR3:面板/日志时间显示时区(IANA TZ 名,默认 UTC)。
      # 推荐:中国用户: Asia/Shanghai 或 Asia/Hong_Kong
      #        美东用户: America/New_York
      #        欧洲用户: Europe/Berlin
      # 注意:此选项只影响面板渲染 / DDNS API / mobileconfig 描述的时间字符串;
      #       不影响系统 TZ、证书有效期、cron 时间计算。
      IKEV2_DISPLAY_TIMEZONE: "${IKEV2_DISPLAY_TIMEZONE:-UTC}"

volumes:
  # 用 external 锁死旧 volume 名（跨项目名升级时不会创建新空 volume）。
  # 创建方式：docker volume create ikev2-panel-v2_ikev2-data
  ikev2-panel-v2_ikev2-data:
    external: true