{{/*
  web/templates/login_content.html — v2.86-PR-Redesign
  EZZON 风格：深黑底 + 双 radial-gradient + grid mask + 居中深色玻璃卡 + 青色发光 mark
*/}}
<section class="login-card">
  <div class="login-card-mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <path d="M16 2 L28 7 V16 C28 23 22 28.5 16 30 C10 28.5 4 23 4 16 V7 Z"
            fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M16 9 V21 M11 14 H21 M13 18 H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="login-card-head">
    <h1>欢迎回来</h1>
    <p>登录 IKEv2 Panel 管理后台</p>
  </div>

  {{if .Error}}
  <div class="banner-danger" role="alert" style="margin-bottom: 1rem;">
    <div>
      <strong>登录失败</strong>
      <small style="display: block; margin-top: 0.25rem; color: inherit; opacity: 0.85;">{{.Error}}</small>
    </div>
  </div>
  {{end}}

  <form method="POST" action="/login" class="login-form" autocomplete="on">
    <label class="login-field">
      <span class="login-field-label">用户名</span>
      <span class="login-field-input">
        <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="off"
               autocorrect="off" spellcheck="false" required autofocus
               placeholder="admin">
      </span>
    </label>

    <label class="login-field">
      <span class="login-field-label">密码</span>
      <span class="login-field-input">
        <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 10V7a4 4 0 1 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input name="password" type="password" autocomplete="current-password" required
               placeholder="••••••••">
      </span>
    </label>

    <button type="submit" class="login-submit">
      <span>登录</span>
      <svg class="login-submit-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

  <div class="login-card-foot">
    登录即表示同意会话内所有操作记入审计日志。
    <span class="login-card-foot-hint">本面板不存储明文密码 · 默认会话 TTL {{.SessionTTL}}</span>
  </div>
</section>

<div class="login-meta">
  <span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    服务地址 <code>{{.Host}}</code>
  </span>
  <span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 7L9 18l-5-5"/>
    </svg>
    版本 <code>v{{.Version}}</code>
  </span>
</div>
