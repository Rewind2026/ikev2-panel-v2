<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - IKEv2 Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-box">
    <h1>管理员登录</h1>
    {{if .Error}}
        <div class="error">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/login">
        <label>用户名<input name="username" value="{{.Username}}" required autofocus></label>
        <label>密码<input name="password" type="password" required></label>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
