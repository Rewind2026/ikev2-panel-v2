<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    v2.86-pr23p favicon.
    Visual 1:1 with style.css L442-450 .topbar-brand-mark:
      - background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 60%, #06b6d4 100%)
      - 4px corner radius
      - inset cyan ring rgba(34,211,238,0.55)
      - bold "I" glyph in deep navy #04141a (ikev2-brand-fg) for max contrast
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="url(#g)"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="rgba(34,211,238,0.55)" stroke-width="1"/>
  <text x="16" y="23" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900" fill="#04141a" letter-spacing="-1">I</text>
</svg>